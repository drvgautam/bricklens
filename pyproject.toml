[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bricklens"
version = "1.0.0"
description = "Semantic fault detection and IEQ advisor over Brick building models (RDF validated, Neo4j served)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "neo4j>=5.20",
  "networkx>=3.2",
  "duckdb>=1.0",
  "pyarrow>=15",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "strawberry-graphql[fastapi]>=0.230",
  "uvicorn>=0.29",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
bricklens = "bricklens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bricklens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP031", "E702", "E731"]

# BrickLens configuration. Every threshold change should come with a one-line rationale
# in docs/decisions/ so the tuning history stays auditable.

building:
  model: models/demo_building.ttl
  brick_ontology: vendor/Brick.ttl        # Brick 1.3, vendored so validation works offline

graph:
  backend: memory                          # memory | neo4j  (memory = networkx, same query surface)
  neo4j:
    uri: bolt://neo4j:7687
    user: neo4j
    password: bricklens
    database: neo4j

telemetry:
  store: data/telemetry.duckdb
  source:
    kind: synthetic                        # synthetic | csv | parquet | csiro | bms_rest
    seed: 42
    start: "2026-08-03"                    # a Monday
    weeks: 4
    resolution_min: 5
    faults: data/faults.csv                # written by the synthetic generator (ground truth)
  # kind: csv
  #   path: data/telemetry.csv
  # kind: csiro
  #   path: ../ahu-fault-detection-dataset/data     # after `git lfs pull`
  #   ahu: 9

schedule:
  occupied_start: "07:00"
  occupied_end: "18:00"
  weekdays_only: true

detectors:
  co2_high:
    enabled: true
    threshold_ppm: 1000      # EN 16798-1 category II upper bound for offices is ~1000 ppm
    dwell_min: 30            # short excursions after meetings are not faults
  temp_band:
    enabled: true
    tolerance_c: 2.0         # ±2 °C around the zone setpoint during occupied hours
    dwell_min: 30
  humidity_band:
    enabled: true
    low_pct: 30
    high_pct: 60
    dwell_min: 60
  damper_fault:
    enabled: true
    co2_ppm: 900             # lower than co2_high: this rule needs command/position evidence too
    cmd_open_pct: 60
    position_delta_pct: 10   # commanded minus measured > delta for dwell → stuck
    dwell_min: 30
  off_hours:
    enabled: true
    power_kw_min: 2.0        # standby draw of the AHU is ~1 kW; above this the fan is running
    dwell_min: 60
  coil_fighting:
    enabled: true
    valve_open_pct: 10
    dwell_min: 15
  peak_volatility:
    enabled: true
    zscore: 3.0
    baseline_days: 7
    dwell_min: 15
  pattern_deviation:
    enabled: true
    method: residual           # residual (weekly-profile z-score, deterministic) | iforest
    zscore: 4.0                # residual method: |z| above this for min_run_min → alert
    sigma_floor_frac: 0.05     # sigma never below 5% of the profile's range (keeps flat signals from screaming)
    contamination: 0.02        # iforest method only
    baseline_days: 7
    min_run_min: 60

localiser:
  max_hops: 4
  shared_fault_min_siblings: 2   # ≥2 sibling points anomalous → equipment-level fault

validation:
  overlap_min: 0.5
  targets:
    precision: 0.80
    recall: 0.80
    localisation_accuracy: 0.85
    false_alerts_per_zone_week: 2.0
